
services:
  - type: web
    name: support-ticket-classifier-api
    runtime: python
    region: singapore
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True); nltk.download('wordnet', quiet=True)"
      python scripts/train.py

    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: FRONTEND_ORIGIN
        value: https://support-ticket-classifier-static.vercel.app
